<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="340" viewBox="0 0 1400 340">
<rect width="1400" height="340" rx="12" fill="#0b1927"/>
<text x="33" y="58" fill="white" font-size="33" font-family="DejaVu Sans,sans-serif" font-weight="bold">HLKRadarTool: enable Multi-target tracking</text>
<text x="33" y="96" fill="#a4d6df" font-size="19" font-family="DejaVu Sans,sans-serif">Configure the LD2450 over Bluetooth — ESP32 reads radar data over UART</text>
<rect x="40" y="125" width="248" height="145" rx="16" fill="#142e3d" stroke="#31c5d2" stroke-width="2"/><circle cx="73" cy="158" r="18" fill="#00b7c8"/><text x="73" y="164" text-anchor="middle" fill="#03121d" font-family="DejaVu Sans" font-size="17" font-weight="bold">1</text><text x="59" y="205" fill="#ffffff" font-family="DejaVu Sans" font-size="23" font-weight="bold">POWER ON</text><text x="59" y="239" fill="#a8dce2" font-family="DejaVu Sans" font-size="15">LD2450 5V</text><path d="M 292 200 l 15 0 l -7 -7 m 7 7 l -7 7" fill="none" stroke="#d1f7fb" stroke-width="3"/><rect x="315" y="125" width="248" height="145" rx="16" fill="#142e3d" stroke="#31c5d2" stroke-width="2"/><circle cx="348" cy="158" r="18" fill="#00b7c8"/><text x="348" y="164" text-anchor="middle" fill="#03121d" font-family="DejaVu Sans" font-size="17" font-weight="bold">2</text><text x="334" y="205" fill="#ffffff" font-family="DejaVu Sans" font-size="23" font-weight="bold">SCAN</text><text x="334" y="239" fill="#a8dce2" font-family="DejaVu Sans" font-size="15">HLK-LD2450_xxxx</text><path d="M 567 200 l 15 0 l -7 -7 m 7 7 l -7 7" fill="none" stroke="#d1f7fb" stroke-width="3"/><rect x="590" y="125" width="248" height="145" rx="16" fill="#142e3d" stroke="#31c5d2" stroke-width="2"/><circle cx="623" cy="158" r="18" fill="#00b7c8"/><text x="623" y="164" text-anchor="middle" fill="#03121d" font-family="DejaVu Sans" font-size="17" font-weight="bold">3</text><text x="609" y="205" fill="#ffffff" font-family="DejaVu Sans" font-size="23" font-weight="bold">CONNECT</text><text x="609" y="239" fill="#a8dce2" font-family="DejaVu Sans" font-size="15">BLE device page</text><path d="M 842 200 l 15 0 l -7 -7 m 7 7 l -7 7" fill="none" stroke="#d1f7fb" stroke-width="3"/><rect x="865" y="125" width="248" height="145" rx="16" fill="#142e3d" stroke="#31c5d2" stroke-width="2"/><circle cx="898" cy="158" r="18" fill="#00b7c8"/><text x="898" y="164" text-anchor="middle" fill="#03121d" font-family="DejaVu Sans" font-size="17" font-weight="bold">4</text><text x="884" y="205" fill="#ffffff" font-family="DejaVu Sans" font-size="23" font-weight="bold">ENABLE</text><text x="884" y="239" fill="#a8dce2" font-family="DejaVu Sans" font-size="15">Multi-person ON</text><path d="M 1117 200 l 15 0 l -7 -7 m 7 7 l -7 7" fill="none" stroke="#d1f7fb" stroke-width="3"/><rect x="1140" y="125" width="248" height="145" rx="16" fill="#142e3d" stroke="#31c5d2" stroke-width="2"/><circle cx="1173" cy="158" r="18" fill="#00b7c8"/><text x="1173" y="164" text-anchor="middle" fill="#03121d" font-family="DejaVu Sans" font-size="17" font-weight="bold">5</text><text x="1159" y="205" fill="#ffffff" font-family="DejaVu Sans" font-size="23" font-weight="bold">TEST</text><text x="1159" y="239" fill="#a8dce2" font-family="DejaVu Sans" font-size="15">T1 / T2 / T3</text><text x="40" y="311" fill="#dbb87d" font-family="DejaVu Sans" font-size="18">Keep module UART at 256000 baud  •  App screen names vary by version</text></svg>